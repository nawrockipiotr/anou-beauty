const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function klucz(h){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(h),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},true,['decrypt'])}
async function otworz(k){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},k,b64(P.c));const ds=new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(ds).text();document.open();document.write(html);document.close()}
(async()=>{try{const z=JSON.parse(localStorage.getItem('anou_przew')||'null');if(z&&z.t>Date.now()){const k=await crypto.subtle.importKey('raw',b64(z.k),'AES-GCM',true,['decrypt']);await otworz(k)}}catch(e){localStorage.removeItem('anou_przew')}})();
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const bl=document.getElementById('blad');bl.textContent='Sprawdzanie…';try{const k=await klucz(document.getElementById('h').value.trim());if(document.getElementById('z').checked){const raw=new Uint8Array(await crypto.subtle.exportKey('raw',k));localStorage.setItem('anou_przew',JSON.stringify({k:btoa(String.fromCharCode(...raw)),t:Date.now()+30*864e5}))}await otworz(k)}catch(err){bl.textContent='Nieprawidłowe hasło.'}};
</script></body></html>
