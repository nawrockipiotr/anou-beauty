<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><meta name="color-scheme" content="light dark"><title>Dostęp chroniony</title>
<style>:root{--tlo:#f4f5f7;--karta:#fff;--tekst:#081732;--tekst2:#4c5871;--linia:#d2d8e4;--akcent:#142A5B;--zloto:#8a6f16;--alarm:#8c1d18;--serif:Charter,"Iowan Old Style",Georgia,"Times New Roman",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}

*{box-sizing:border-box}html,body{margin:0}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--tlo);color:var(--tekst);font:16px/1.5 var(--sans)}
form{background:var(--karta);border:1px solid var(--linia);border-radius:12px;padding:32px;width:min(440px,100%)}
.nad{margin:0 0 6px;font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--zloto)}
h1{margin:0 0 8px;font:600 1.5rem/1.25 var(--serif)}p{margin:0 0 20px;color:var(--tekst2);font-size:.95rem}
input[type=password]{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--linia);border-radius:8px;background:var(--tlo);color:var(--tekst);font:inherit}

:focus-visible{outline:2px solid var(--zloto);outline-offset:2px}#blad{min-height:1.5em;margin-top:12px;color:var(--alarm);font-size:.9rem}</style></head>
